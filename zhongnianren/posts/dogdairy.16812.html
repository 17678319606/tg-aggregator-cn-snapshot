<h1>中年创业的有两种</h1>
<div class="content"><html><head></head><body>中年创业的有两种。<br>第一种是带资源出来的，或者背后有绝对靠谱的资源。这种很稀少，严格来说不是创业是变现。这种如果说找对象，绝对不会出现在婚姻市场。<br>第二种我就不说了，除了骗子就是玩情怀的，一辈子不创次业是不完美的人生，结果都一样，除了穷什么都没有。</body></html></div>
