<h1>昨天我爸过生日，就带着家里小盆友回去陪了他一下</h1>
<div class="meta">2026/8/9 22:57:25</div>
<div class="content">昨天我爸过生日，就带着家里小盆友回去陪了他一下。我爸以前特别爱赌，那时候家里全靠我妈一个人支撑着。在我很小的时候（大概是小学五六年级），给他写了一封信。我在信里说，如果他以后再这么好赌，我就会和他决裂，我自己出去打工养活整个家庭。这封信他肯定是看到了，因为那之后他确实没怎么赌了，开始打工挣钱养家。十多年前，他打工积累了点钱，又去做所谓的生意。结果利滚利，再加上加杠杆，各种折腾，最后欠了几百万。不过…</div>
