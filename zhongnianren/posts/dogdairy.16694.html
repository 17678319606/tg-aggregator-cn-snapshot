<div class="content">小时候，我养过猪。猪最喜欢的食物之一，就是潲水（Slop）。吃潲水长大的猪，会比只吃饲料长大的猪，健康很多。上市之后的猪肉，也好吃很多。<br>潲水（Slop）是好东西，喂养大的猪有猪肉香。<br>饲料猪肉，才味同嚼肉，闻不到猪香。</div>
