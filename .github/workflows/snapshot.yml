name: snapshot-sync

on:
  schedule:
    - cron: '17 * * * *'   # 每小时第17分运行（避开整点高峰）
  workflow_dispatch: {}    # 允许在 Actions 页面手动触发一次

permissions:
  contents: write          # 允许把生成的快照推送回本仓库

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 生成静态快照（回源 CF Worker，海外 Runner 可直连）
        run: node publish.mjs
      - name: 提交并推送
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "snapshot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "snapshot: $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "no changes"
          git push
      - name: 清除 jsDelivr 缓存（否则 @main 会返回旧快照）
        run: |
          curl -sS "https://purge.jsdelivr.net/gh/17678319606/tg-aggregator-cn-snapshot@main" || true
